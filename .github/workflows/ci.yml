name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Run executable JAR on Unix
        if: runner.os != 'Windows'
        run: |
          test -f target/autoparts-all.jar
          java -jar target/autoparts-all.jar --version
          java -jar target/autoparts-all.jar --input data/input.csv --output target/ci-report.txt

      - name: Run executable JAR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath target/autoparts-all.jar)) { throw 'Executable JAR was not created' }
          java -jar target/autoparts-all.jar --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/autoparts-all.jar --input data/input.csv --output target/ci-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/autoparts-all.jar
          if-no-files-found: error
